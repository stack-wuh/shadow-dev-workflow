name: quality-gate

# 机器门：本仓所有可离线判定的断言都在这儿跑，AI 与人的口头自证不可替代它。
# 覆盖：版本同源 → 能力一致性（strict，禁止半绿）→ 知识治理（卡片/source/路由/死链/残留）→ 产物与安装器测试。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned shadow-dev CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PIN=$(node -pe 'require("./package.json").cliVersion')
          bash scripts/install-cli.sh install --version "$PIN"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH 只对后续步骤生效；同一步内紧接着的冒烟必须自带 PATH，
          # 否则 windows-latest（Git Bash 默认不含 ~/.local/bin）判红而 ubuntu/macos 靠镜像默认值蒙过。
          export PATH="$HOME/.local/bin:$PATH"
          shadow-dev --version

      - name: 版本同源门
        run: npm run check:version

      - name: 能力一致性门（strict：命令目录不可解析即判红，禁止降级半绿）
        shell: bash
        run: npm run check:requires:strict

      - name: 知识治理门（卡片字段 / source / menu 路由 / 死链 / 废弃残留）
        shell: bash
        run: npm run check:knowledge -- --forbid 'tdd-verification,▶ [TDD]'

      - name: 产物与安装器测试
        run: npm test
