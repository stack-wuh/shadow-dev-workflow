# ================================================================
# Agent Loop workflow-control state
# Schema: agent-loop/v1
# This file coordinates the fixed OpenSpec artifacts; it does not replace them.
# proposal.md, design.md, tasks.md and specs/<domain>/spec.md remain required.
# ================================================================
schema: agent-loop/v1

change:
  id: <YYYY-MM-DD-P-or-B-kebab-case>
  title: <需求标题>
  type: feature # feature | bug
  status: proposed # proposed | discussed | applying | reviewing | archived | committed | blocked | failed
  createdAt: <ISO-8601>
  issue: null

# Fixed, human-readable OpenSpec artifacts. Their contents remain authoritative
# for requirements/design/tasks; YAML indexes their lifecycle and limits what
# each Agent Loop phase has to load.
artifacts:
  proposal:
    path: proposal.md
    status: pending # pending | completed
    summary: null
    template:
      id: proposal
      source: skills/shadow-dev-propose/templates/proposal.md
      contractVersion: 1
      digest: null
    validation:
      status: pending # pending | passed | failed
      checkedAt: null
      missing: []
  design:
    path: design.md
    status: pending # pending | completed
    summary: null
    template:
      id: design
      source: skills/shadow-dev-propose/templates/design.md
      contractVersion: 1
      digest: null
    validation:
      status: pending # pending | passed | failed
      checkedAt: null
      missing: []
  tasks:
    path: tasks.md
    status: pending # pending | completed
    summary: null
    template:
      id: tasks
      source: skills/shadow-dev-propose/templates/tasks.md
      contractVersion: 1
      digest: null
    validation:
      status: pending # pending | passed | failed
      checkedAt: null
      missing: []
  specs:
    status: pending # pending | completed
    entries:
      - path: specs/<domain>/spec.md
        template:
          id: spec
          source: skills/shadow-dev-propose/templates/spec.md
          contractVersion: 1
          digest: null
        validation:
          status: pending # pending | passed | failed
          checkedAt: null
          missing: []

proposal:
  status: pending # pending | completed
  source:
    type: manual # manual | github_issue
    issueNumber: null
  intent: <需求摘要>
  background: <为什么现在要做>
  goals: []
  nonGoals: []
  scope:
    packages: []
    files: []
  acceptanceCriteria: []
  constraints: []
  risks: []
  domain:
    name: <领域名称>
    keywords: []
    description: <一句话描述>

# Filled by discuss. design.md and tasks.md remain the fixed detailed outputs.
discuss:
  status: pending # pending | completed
  decisions: []
  architecture:
    summary: null
    modules: []
  contracts:
    api: []
    data: []
  reuse:
    components: []
    newComponents: []
  implementationNotes: []
  impact:
    dependencies: []
    compatibility: null
    rollback: null

# Generated by discuss; executed by apply. tasks.md remains the fixed plan
# artifact; this workflow is its execution projection/checkpoint graph.
apply:
  status: pending # pending | ready | running | completed | blocked | failed
  generatedFrom:
    - proposal
    - discuss
  instructions: []
  # Each task has id, title, status, dependsOn, files, instructions,
  # verification, requiredInputs, attempts, maxAttempts, evidence, failure.
  workflow: []
  repairWorkflow: []
  checkpoint:
    lastCompletedTaskId: null
    updatedAt: null

review:
  status: pending # pending | running | passed | warnings | blocked
  verification: []
  findings: []
  summary: null

archive:
  status: pending # pending | completed
  archivedAt: null
  specSync: []
  indexEntry: null
  componentScenarios: []

commit:
  status: pending # pending | completed | blocked
  branch: null
  commits: []
  pullRequest: null

runtime:
  phase: propose # propose | discuss | apply | review | archive | commit
  state: idle # idle | running | waiting_for_input | blocked | failed | completed
  attempts: 0
  resume:
    taskId: null
    command: null
  requiredInputs: []
  failure: null
  updatedAt: <ISO-8601>
